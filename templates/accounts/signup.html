{% extends "base.html" %}

{% block content %}
<div
    style="max-width:420px;margin:60px auto;padding:28px;background:#fff;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,0.08);">
    <h2 style="margin-bottom:18px;">會員註冊</h2>

    {% if form.errors %}
    <p style="color:#b00020;">{{ form.errors }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>帳號</label>
        {{ form.username }}

        <label style="margin-top:12px;">姓名</label>
        {{ form.full_name }}

        <label style="margin-top:12px;">電話</label>
        {{ form.phone_number }}

        <label style="margin-top:12px;">密碼</label>
        {{ form.password1 }}

        <label style="margin-top:12px;">確認密碼</label>
        {{ form.password2 }}

        <button type="submit" class="btn-primary" style="width:100%;margin-top:20px;">
            註冊
        </button>
    </form>

    <p style="margin-top:16px;text-align:center;">
        已有帳號？
        <a href="{% url 'login' %}">前往登入</a>
    </p>
</div>
{% endblock %}

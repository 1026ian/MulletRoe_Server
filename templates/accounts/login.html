{% extends "base.html" %}
{% load static %}

{% block content %}
<div
    style="max-width:420px;margin:60px auto;padding:28px;background:#fff;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,0.08);">
    <h2 style="margin:0 0 18px 0;">會員登入</h2>

    {% if form.errors %}
    <p style="color:#b00020;margin:0 0 12px 0;">帳號或密碼不正確</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label style="display:block;margin:10px 0 6px;">帳號</label>
        {{ form.username }}

        <label style="display:block;margin:14px 0 6px;">密碼</label>
        {{ form.password }}

        <button type="submit" class="btn-primary" style="width:100%;margin-top:18px;">登入</button>
    </form>
    <p style="margin-top:16px;text-align:center;">
        還沒有帳號？
        <a href="{% url 'signup' %}">立即註冊</a>
    </p>
</div>

{% endblock %}
